# ============================================================
#  Publishes the site to GitHub Pages.
#
#  Runs in three situations:
#   1. push to main    -> you changed the site or published a piece
#   2. every 6 hours   -> re-fetches GitHub data and republishes, so new
#                         repositories appear on their own
#   3. manually        -> Actions tab > "Publish site" > Run workflow
#                         (or from a terminal: gh workflow run deploy.yml)
# ============================================================
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    # Minute 0, every 6 hours (UTC). Use '0 * * * *' for hourly.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Least privilege needed to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys run at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build
        env:
          # Lifts the GitHub API limit from 60 to 5000 requests/hour during the
          # build. This is the Actions-provided token — nothing to create.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the build for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
